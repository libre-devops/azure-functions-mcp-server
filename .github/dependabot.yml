version: 2
updates:
  - package-ecosystem: pip
    directory: "/src"
    schedule:
      interval: weekly
      day: monday
    groups:
      # The azure packages move together, and one PR a week is plenty for the rest too.
      pip-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: terraform
    directory: "/terraform"
    schedule:
      interval: weekly
      day: monday
